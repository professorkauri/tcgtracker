<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf3fa">
  <title>Pokémon Home Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <h1>Pokémon <span>Tracker</span></h1>
    <div class="collection-progress" aria-label="Collection progress" aria-live="polite">
      <div><span>Owned</span><progress id="owned-progress" value="0" max="1"></progress><b id="owned-count">0 / 0</b></div>
      <div><span>Replace</span><progress id="replace-progress" value="0" max="1"></progress><b id="replace-count">0 / 0</b></div>
    </div>
  </header>

  <main id="app">
    <div id="boxes" class="boxes"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-ball">✓</div><h2>No replacements queued</h2><p>No Pokémon are marked as replacement priorities right now.</p>
    </div>
  </main>

  <form id="search-panel" class="search-panel" role="search" hidden>
    <label for="search-input">Search</label>
    <input id="search-input" type="search" autocomplete="off" placeholder="Search Pokémon or forms">
  </form>

  <nav class="dock" aria-label="Main navigation">
    <button type="button" data-view="pokedex" class="active"><svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 4.5h9.25a3.75 3.75 0 0 1 3.75 3.75v11.25H9.25a3.75 3.75 0 0 1-3.75-3.75V4.5Z"></path><path d="M9 8h6"></path><path d="M9 11.5h5"></path><path d="M9 15h3"></path></svg>Pokédex</button>
    <button type="button" data-view="search"><svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="5.75"></circle><path d="m15 15 4.5 4.5"></path></svg>Search</button>
    <button type="button" data-view="transfer"><svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v12"></path><path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path><path d="M5 15.5v2.25A2.25 2.25 0 0 0 7.25 20h9.5A2.25 2.25 0 0 0 19 17.75V15.5"></path></svg>Replace<b id="transfer-count">0</b></button>
  </nav>
  <script src="data/pokemon.js"></script>
  <script src="app.js"></script>
</body>
</html>
